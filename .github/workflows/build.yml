name: Build installers

# Gera os instaladores dos 3 OS a cada tag (v1.2.3) e anexa no GitHub Release.
# Também roda manualmente (workflow_dispatch) pra testar o build sem publicar.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: mr-whisper-linux.tar.gz
          # um único .dmg universal2 (Intel + Apple Silicon) no runner ARM, que
          # está sempre disponível — evita o runner macos-13 (Intel) congestionado.
          - os: macos-14
            asset: mr-whisper-macos.dmg
            mac_arch: universal2
          - os: windows-latest
            asset: mr-whisper-windows.zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Linux system libs (Qt/X11)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxcb-cursor0 xclip xdotool

      - name: Build (PyInstaller)
        env:
          MRW_MAC_ARCH: ${{ matrix.mac_arch }}
        run: pyinstaller --noconfirm mr-whisper.spec

      # ── empacotar por OS ────────────────────────────────────────────────────
      - name: Package Linux
        if: runner.os == 'Linux'
        run: tar -czf mr-whisper-linux.tar.gz -C dist mr-whisper

      - name: Package macOS (.dmg)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname mr-whisper -srcfolder "dist/mr-whisper.app" \
            -ov -format UDZO "${{ matrix.asset }}"

      - name: Package Windows (.zip)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/mr-whisper/* -DestinationPath mr-whisper-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
