name: Build installers

# Gera os instaladores dos 3 OS a cada tag (v1.2.3) e anexa no GitHub Release.
# Também roda manualmente (workflow_dispatch) pra testar o build sem publicar.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: mr-whisper-linux.tar.gz
          - os: macos-14           # Apple Silicon (M1/M2/M3) — nativo
            asset: mr-whisper-macos-arm64.dmg
            mac_arch: arm64
          - os: macos-14           # Intel .dmg buildado via Rosetta (x86_64) no
            asset: mr-whisper-macos-intel.dmg   # runner ARM (o Intel está fora)
            mac_arch: x86_64
          - os: windows-latest
            asset: mr-whisper-windows.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Python nativo do runner (usado por todos, menos o build Intel-via-Rosetta)
      - uses: actions/setup-python@v5
        if: matrix.mac_arch != 'x86_64'
        with:
          python-version: "3.11"

      - name: Install deps (native)
        if: matrix.mac_arch != 'x86_64'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Linux system libs (Qt/X11)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxcb-cursor0 xclip xdotool

      - name: Build (native PyInstaller)
        if: matrix.mac_arch != 'x86_64'
        run: pyinstaller --noconfirm mr-whisper.spec

      # ── Intel .dmg via Rosetta: Python x86_64 do Homebrew, tudo sob arch -x86_64
      - name: Build Intel via Rosetta (x86_64)
        if: matrix.mac_arch == 'x86_64'
        run: |
          set -e
          # Homebrew x86_64 (sob Rosetta) + Python x86_64
          arch -x86_64 /usr/local/bin/brew --version >/dev/null 2>&1 || \
            arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          arch -x86_64 /usr/local/bin/brew install python@3.11
          PY=/usr/local/opt/python@3.11/bin/python3.11
          arch -x86_64 $PY -m pip install --upgrade pip
          arch -x86_64 $PY -m pip install -r requirements.txt pyinstaller
          arch -x86_64 $PY -m PyInstaller --noconfirm mr-whisper.spec

      # ── empacotar por OS ────────────────────────────────────────────────────
      - name: Package Linux
        if: runner.os == 'Linux'
        run: tar -czf mr-whisper-linux.tar.gz -C dist mr-whisper

      - name: Package macOS (.dmg)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname mr-whisper -srcfolder "dist/mr-whisper.app" \
            -ov -format UDZO "${{ matrix.asset }}"

      - name: Package Windows (.zip)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/mr-whisper/* -DestinationPath mr-whisper-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
